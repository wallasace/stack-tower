<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #081326; }
    body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    #unity-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; background: #081326; outline: none; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #bar { width: min(60vw, 320px); height: 6px; border-radius: 3px; background: rgba(143, 163, 192, 0.25); overflow: hidden; }
    #fill { width: 0; height: 100%; background: #5ee6b4; transition: width 0.2s; }
    #error { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; padding: 24px;
             color: #f3ebdd; font: 16px/1.5 sans-serif; text-align: center; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading"><div id="bar"><div id="fill"></div></div></div>
  <div id="error"></div>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var config = {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
      workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      // O canvas ocupa a janela inteira e o jogo acompanha o tamanho dela
      matchWebGLToCanvasSize: true,
      // Densidade entre 1 e 2: nunca abaixo de 1 (zoom do navegador < 100% borrava o jogo), máx. 2 pelo desempenho
      devicePixelRatio: Math.max(1, Math.min(window.devicePixelRatio || 1, 2)),
    };
    createUnityInstance(canvas, config, function (progress) {
      document.querySelector("#fill").style.width = (100 * progress) + "%";
    }).then(function () {
      document.querySelector("#loading").remove();
      canvas.focus();
    }).catch(function (message) {
      var error = document.querySelector("#error");
      error.textContent = "Couldn't load the game. Try refreshing the page.";
      error.style.display = "flex";
      console.error(message);
    });
  </script>
</body>
</html>
